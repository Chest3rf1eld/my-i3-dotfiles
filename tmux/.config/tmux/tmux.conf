unbind-key -a -T root

set-option -g default-shell /usr/bin/zsh
set-option -g default-command /usr/bin/zsh

set -g pane-border-lines "double"

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

setw -g mode-keys vi

set -g mouse on

set -s escape-time 0

set -g history-limit 2000

bind -n M-r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"
bind -n M-s choose-tree -s

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

bind -n M-S-Left resize-pane -L 5
bind -n M-S-Right resize-pane -R 5
bind -n M-S-Up resize-pane -U 3
bind -n M-S-Down resize-pane -D 3

bind -n M-h split-window -v
bind -n M-v split-window -h

bind -n M-Enter new-window
bind -n M-c confirm-before -p "Kill current pane? (y/n)" kill-pane
bind -n M-q confirm-before -p "Kill current window? (y/n)" kill-window
bind -n M-d detach
bind -n M-Q confirm-before -p "Kill entire session? (y/n)" kill-session

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy || xclip -in -selection clipboard"
bind -n M-/ copy-mode \; command-prompt -p "(search down)" "send -X search-forward '%%%'"
bind -n M-? copy-mode \; command-prompt -p "(search up)"   "send -X search-backward '%%%'"

#myCustom
bind -n M-[ copy-mode

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
run '~/.config/tmux/plugins/tpm/tpm'

# Ember theme — shared with i3, Polybar, Rofi and Alacritty.
set -gu status-format
set -g status 2
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-left-length 24
set -g status-right-length 12
set -g status-style "bg=#181512,fg=#cfc4b5"

set -g status-left "#[fg=#e39a50,bold] 󰆍  #S  #[fg=#373029]│ "
set -g status-right "#{?client_prefix,#[fg=#e39a50,bold] PREFIX  ,}"
set -g status-format[0] "#[bg=#181512] "
set -g status-format[1] "#[align=left]#{E:status-left}#[list=on align=left]#{W:#{E:window-status-format},#{E:window-status-current-format}}#[nolist align=right]#{E:status-right}"

setw -g window-status-separator ""
setw -g window-status-style "bg=#181512,fg=#66594a"
setw -g window-status-current-style "none,bg=#181512,fg=#f0ad68,bold,nounderscore,nooverline"
setw -g window-status-format "#[fg=#66594a] #I  #W "
setw -g window-status-current-format "#[bg=#181512,fg=#f0ad68,bold,nounderscore,nooverline] #I  #W#{?window_zoomed_flag, 󰊓,}  "
setw -g window-status-activity-style "fg=#dfbd6f,bold"
setw -g window-status-bell-style "bg=#d66b5d,fg=#181512,bold"

set -g message-style "bg=#373029,fg=#e39a50,bold"
set -g message-command-style "bg=#2b2621,fg=#eee6da"
set -g mode-style "bg=#e39a50,fg=#181512,bold"
set -g clock-mode-colour "#e39a50"
set -g display-panes-colour "#66594a"
set -g display-panes-active-colour "#e39a50"

set -g pane-border-lines heavy
set -g pane-border-indicators both
set -g pane-border-style "fg=#373029"
set -g pane-active-border-style "fg=#e39a50,bold"
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[fg=#181512,bg=#e39a50,bold] #P  #{pane_current_command} #[default],#[fg=#66594a] #P  #{pane_current_command} }"
