unbind-key -a -T root

set-option -g default-shell /usr/bin/zsh
set-option -g default-command /usr/bin/zsh

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

setw -g mode-keys vi

set -g mouse on

# Mouse wheel scrolling: enter tmux history in shell panes, but pass wheel
# events through to applications that handle the mouse themselves.
bind -n WheelUpPane {
    if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' {
        send-keys -M
    } {
        if -F '#{alternate_on}' { send-keys -N 2 Up } { copy-mode -e }
    }
}

bind -n WheelDownPane {
    if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' {
        send-keys -M
    } {
        if -F '#{alternate_on}' { send-keys -N 2 Down }
    }
}

set -s escape-time 0

set -g history-limit 2000

bind -n M-r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"
bind -n M-s choose-tree -s

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

bind -n M-S-Left resize-pane -L 5
bind -n M-S-Right resize-pane -R 5
bind -n M-S-Up resize-pane -U 3
bind -n M-S-Down resize-pane -D 3

bind -n M-h split-window -v
bind -n M-v split-window -h

bind -n M-Enter new-window
bind -n M-c confirm-before -p "Kill current pane? (y/n)" kill-pane
bind -n M-q confirm-before -p "Kill current window? (y/n)" kill-window
bind -n M-d detach
bind -n M-Q confirm-before -p "Kill entire session? (y/n)" kill-session

bind -T copy-mode-vi WheelUpPane select-pane \; send-keys -X -N 2 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 2 scroll-down
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy || xclip -in -selection clipboard"
bind -n M-/ copy-mode \; command-prompt -p "(search down)" "send -X search-forward '%%%'"
bind -n M-? copy-mode \; command-prompt -p "(search up)"   "send -X search-backward '%%%'"

#myCustom
bind -n M-[ copy-mode

# =====================================================================
# Theme: catppuccin/tmux dressed in the Ember palette.
#
# The flavour file assigns every colour with `set -ogq`, so whatever is
# set here survives loading the theme and displaces mocha. Never set
# @catppuccin_reset — it unsets all @thm_* and would wipe this block.
# =====================================================================

# Palette — kept in sync with polybar/.config/polybar/config.ini [colors].
set -g @thm_bg        "#181512"
set -g @thm_fg        "#eee6da"
set -g @thm_mantle    "#211d19"
set -g @thm_crust     "#100e0c"
set -g @thm_rosewater "#e4d2bd"
set -g @thm_flamingo  "#786a59"
set -g @thm_pink      "#bd8f9e"
set -g @thm_mauve     "#e39a50"
set -g @thm_red       "#d66b5d"
set -g @thm_maroon    "#a95348"
set -g @thm_peach     "#f0ad68"
set -g @thm_yellow    "#dfbd6f"
set -g @thm_green     "#9caf78"
set -g @thm_teal      "#83aaa0"
set -g @thm_sky       "#efc795"
set -g @thm_sapphire  "#c67c3a"
set -g @thm_blue      "#e39a50"
set -g @thm_lavender  "#d8aa80"
set -g @thm_subtext_0 "#cfc4b5"
set -g @thm_subtext_1 "#a99d8d"
set -g @thm_overlay_0 "#66594a"
set -g @thm_overlay_1 "#786a59"
set -g @thm_overlay_2 "#8c7d6a"
set -g @thm_surface_0 "#2b2621"
set -g @thm_surface_1 "#373029"
set -g @thm_surface_2 "#463c32"

# Layout. Must precede the theme — catppuccin branches on these at source time.
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_status_background "#{@thm_bg}"
# Separator style must stay glyph-free. The powerline separators (U+E0B4/B6/BA/BC)
# are drawn ~2px taller than a terminal cell, so wherever one abuts a plain
# background-coloured cell the plain cell reads as a dark notch right above the
# character. "basic" uses spaces only, so every block is a terminal-painted
# rectangle exactly one cell tall. Measured: with slanted, the number cell sat 2px
# lower than its neighbours; with basic, all columns share one top and one bottom.
set -g @catppuccin_window_status_style "basic"
set -g @catppuccin_window_number_position "left"
set -g @catppuccin_status_left_separator ""
set -g @catppuccin_status_right_separator " "

# Pad every coloured block the same way. A window number block is "<sp>#I<sp>"
# (3 cells) because the basic style puts a space on each side; the module icons
# ship with a trailing space only, so their blocks came out 2 cells wide and the
# bar looked ragged. Give the icon a leading space too, and a trailing separator,
# so the session module and the windows share one shape: [ block ] text.
set -g @catppuccin_session_icon "  "

# Drop the session name: these sessions are auto-numbered, so #S only ever
# showed a digit. The block stays as the prefix indicator — its colour is
# #{?client_prefix,red,green}, so it turns red while the prefix is held.
set -g @catppuccin_session_text ""
set -g @catppuccin_window_flags "icon"

# The stock flags format ends with a space even when a window has no flags, and
# it lands next to the window right separator — so windows ended up with two
# trailing spaces where the status modules have one. Same string as upstream,
# minus that trailing space.
set -g @catppuccin_window_flags_icon_format "##{?window_activity_flag,#{E:@catppuccin_window_flags_icon_activity},}##{?window_bell_flag,#{E:@catppuccin_window_flags_icon_bell},}##{?window_silence_flag,#{E:@catppuccin_window_flags_icon_silent},}##{?window_active,#{E:@catppuccin_window_flags_icon_current},}##{?window_last_flag,#{E:@catppuccin_window_flags_icon_last},}##{?window_marked_flag,#{E:@catppuccin_window_flags_icon_mark},}##{?window_zoomed_flag,#{E:@catppuccin_window_flags_icon_zoom},}"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

# Catppuccin seats the text half of every element on a surface colour, which
# reads as a dark slab glued to each pill. Put the text straight on the bar
# background so only the number/icon block carries colour.
set -g @catppuccin_window_text_color "#{@thm_bg}"
set -g @catppuccin_window_current_text_color "#{@thm_bg}"
set -g @catppuccin_status_module_text_bg "#{@thm_bg}"

set -g @catppuccin_pane_status_enabled "yes"
set -g @catppuccin_pane_color "#{@thm_mauve}"
set -g @catppuccin_pane_default_text "##{pane_current_command}"
set -g @catppuccin_pane_left_separator ""
set -g @catppuccin_pane_middle_separator " "
set -g @catppuccin_pane_right_separator ""
set -g @catppuccin_pane_border_style "fg=#{@thm_surface_1}"
set -g @catppuccin_pane_active_border_style "fg=#{@thm_mauve},bold"

# The theme derives these three with `set -ogqF` (only-if-unset), so on a live
# reload they keep whatever the previous source left behind and the separator
# style never changes. Drop them so M-r rebuilds them from the current style.
set -ug @catppuccin_window_current_left_separator
set -ug @catppuccin_window_current_middle_separator
set -ug @catppuccin_window_current_right_separator

run '~/.config/tmux/plugins/catppuccin/catppuccin.tmux'

# Everything below needs the @catppuccin_status_* modules to already exist.
# One row only. `status 2` added a blank spacer row above the bar, which reads as
# a dark band directly over the text. Unset status-format too, so a live reload
# drops any stale two-row layout and we fall back to tmux's default — that default
# also carries the range= markers that make the bar clickable.
set -g status on
set -gu status-format
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 60

set -g status-left   "#{E:@catppuccin_status_session}"
# Nothing on the right. tmux-continuum prepends its save hook to status-right
# from tpm below; that is an invisible #() call, so an empty value is fine.
set -g status-right ""

setw -g window-status-separator ""

# The theme paints these teal; pull them back to the Ember amber.
set -gF message-style         "fg=#{@thm_crust},bg=#{@thm_mauve},bold,align=centre"
set -gF message-command-style "fg=#{@thm_fg},bg=#{@thm_surface_0},align=centre"
set -gF mode-style            "bg=#{@thm_mauve},fg=#{@thm_crust},bold"
set -gF display-panes-colour        "#{@thm_overlay_0}"
set -gF display-panes-active-colour "#{@thm_mauve}"

# Match pane borders and pane titles to the same Ember status-bar module shape:
# a coloured index block plus plain text on the bar background.
set -gF pane-border-style        "fg=#{@thm_surface_1},bg=#{@thm_bg}"
set -gF pane-active-border-style "fg=#{@thm_mauve},bg=#{@thm_bg},bold"
set -gF pane-border-format       "#{?pane_active,#[fg=#{@thm_crust},bg=#{@thm_mauve},bold] #P #[fg=#{@thm_fg},bg=#{@thm_bg},nobold] #{b:pane_current_path} ,#[fg=#{@thm_bg},bg=#{@thm_surface_1}] #P #[fg=#{@thm_fg},bg=#{@thm_bg}] #{b:pane_current_path} }"

set -g pane-border-lines heavy
set -g pane-border-indicators off
set -g pane-border-status top

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
run '~/.config/tmux/plugins/tpm/tpm'

set -g extended-keys on
set -g extended-keys-format csi-u
