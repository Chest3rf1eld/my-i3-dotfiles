[colors]
; Ember: тёплый графит с янтарным акцентом
base      = #181512
mantle    = #211d19
crust     = #100e0c

; текст и приглушённые подписи — почти белый с тёплым оттенком
text      = #eee6da
subtext0  = #cfc4b5
subtext1  = #a99d8d

; поверхности/бордеры — ступени тёплого коричневого
surface0  = #2b2621
surface1  = #373029
surface2  = #463c32

; оверлеи — тёплые коричнево-серые
overlay0  = #66594a
overlay1  = #786a59
overlay2  = #8c7d6a

; акценты — “янтарь/терракота”
blue      = #e39a50
lavender  = #d8aa80
sapphire  = #c67c3a
sky       = #efc795

; немного оливково-песочного, если пригодится
teal      = #83aaa0
green     = #9caf78

; тёплые акценты (свет, батарея и т.п.)
yellow    = #dfbd6f
peach     = #f0ad68
maroon    = #a95348
red       = #d66b5d

; основной акцент для `primary`
mauve     = #e39a50
pink      = #bd8f9e

; разделители/второстепенное — “тёплый бетон”
flamingo  = #786a59
rosewater = #e4d2bd

; прозрачный
transparent = #00000000

;==========================================================
;
;
;   ██████╗  ██████╗ ██╗  ██╗   ██╗██████╗  █████╗ ██████╗
;   ██╔══██╗██╔═══██╗██║  ╚██╗ ██╔╝██╔══██╗██╔══██╗██╔══██╗
;   ██████╔╝██║   ██║██║   ╚████╔╝ ██████╔╝███████║██████╔╝
;   ██╔═══╝ ██║   ██║██║    ╚██╔╝  ██╔══██╗██╔══██║██╔══██╗
;   ██║     ╚██████╔╝███████╗██║   ██████╔╝██║  ██║██║  ██║
;   ╚═╝      ╚═════╝ ╚══════╝╚═╝   ╚═════╝ ╚═╝  ╚═╝╚═╝  ╚═╝
;
;
;   To learn more about how to configure Polybar
;   go to https://github.com/polybar/polybar
;
;   The README contains a lot of information
;
;==========================================================

[colors]
background = ${colors.base}
background-alt = ${colors.blue}
foreground = ${colors.text}
primary = ${colors.mauve}
secondary = ${colors.mantle}
alert = ${colors.red}
disabled = ${colors.subtext1}

[bar/toph]
monitor = ${env:MONITOR:}
width = 100%
height = 30pt
radius = 10

; dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

bottom = true

line-size = 2pt

border-size = 5px
border-color = #00000000

padding-left = 1
padding-right = 2

module-margin = 1

#separator = |
separator-foreground = ${colors.flamingo}

font-0 = Cascadia Mono:style=Bold:size=15;5
font-1 = Cascadia Mono NF:style=Bold:size=20;5
font-2 = JetBrainsMono Nerd Font Mono:style=Bold:size=20;5

modules-left = xworkspaces i3
modules-center =
modules-right = systray xkeyboard memory cpu idle battery date

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; wm-restack = generic
; wm-restack = bspwm
; wm-restack = i3

; override-redirect = true

[module/systray]
type = internal/tray

format-margin = 8pt
tray-spacing = 16pt

[module/xworkspaces]
type = internal/xworkspaces

icon-0 = 1;%{T2}%{T-}
icon-1 = 2;%{T2}%{T-}
icon-2 = 3;%{T2}󰨞%{T-}
icon-3 = 4;4
icon-4 = 5;5
icon-5 = 6;6
icon-6 = 7;7
icon-7 = 8;8
icon-8 = 9;9
icon-9 = 10;%{T2}%{T-}

label-active = %icon%
label-active-background = ${colors.surface1}
label-active-foreground = ${colors.peach}
label-active-underline= ${colors.mauve}
label-active-padding = 1

label-occupied = %icon%
label-occupied-foreground = ${colors.mauve}
label-occupied-padding = 1

label-urgent = %icon%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %icon%
label-empty-foreground = ${colors.overlay0}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

[module/filesystem]
type = internal/fs
interval = 25

mount-0 = /

label-mounted = %{F#F0C674}%mountpoint%%{F-} %percentage_used%%

label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = custom/script
exec = ~/.config/polybar/scripts/volume-status.sh
tail = true
click-left = pavucontrol

[module/xkeyboard]
type = internal/xkeyboard

; игнорируем Num Lock, чтобы он не мусорил
blacklist-0 = num lock

; что рисуем в модуле: раскладку + индикаторы
; (по факту — только CapsLock)
format = <label-layout> <label-indicator>
format-spacing = 0

; отображение раскладки (ru / us и т.п.)
label-layout = %layout%
label-layout-foreground = ${colors.primary}

; --- Кастомный CapsLock ---
; по умолчанию не рисуем никаких иконок для индикаторов
indicator-icon-default = ""
; а для CapsLock рисуем замочек (иконка из Nerd Font)
indicator-icon-0 = caps lock;;

; когда CapsLock включён — показываем только иконку
label-indicator-on = %{T2}%icon%%{T-}
; когда выключен — ничего не рисуем
label-indicator-off =

; лёгкий акцент по цвету, без фона и огромных паддингов
label-indicator-padding = 1
label-indicator-margin = 0
label-indicator-foreground = ${colors.peach}

[module/memory]
type = internal/memory
interval = 2
format-prefix = %{A1:alacritty -e btop &:}%{T2}󰘚%{T-} %{A}
format-prefix-foreground = ${colors.primary}
label = %{A1:alacritty -e btop &:}%percentage_used:2%%%{A}

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = %{A1:~/.config/polybar/scripts/cpu-profile-toggle.sh --toggle &:}%{T2}󰍛%{T-} %{A}
format-prefix-foreground = ${colors.primary}
label = %{A1:~/.config/polybar/scripts/cpu-profile-toggle.sh --toggle &:}%percentage:2%%%{A}

[module/battery]
type = internal/battery

; какие устройства использовать
battery = BAT0
adapter = AC

; как часто опрашивать (в секундах)
poll-interval = 5

; процент, при котором считаем батарею полной
full-at = 99
low-at = 5

; форматы вывода
format-charging = %{A1:~/.config/polybar/scripts/battery-threshold-toggle.sh --toggle &:}<animation-charging> <label-charging>%{A}
format-discharging = %{A1:~/.config/polybar/scripts/battery-threshold-toggle.sh --toggle &:}<ramp-capacity> <label-discharging>%{A}
format-full = %{A1:~/.config/polybar/scripts/battery-threshold-toggle.sh --toggle &:}%{T2}%{T-}  <label-full>%{A}

label-charging = %percentage%% 
label-discharging = %percentage%% 
label-full = %percentage%%

; анимация при зарядке
animation-charging-0 = %{T2}%{T-}
animation-charging-1 = %{T2}%{T-}
animation-charging-2 = %{T2}%{T-}
animation-charging-3 = %{T2}%{T-}
animation-charging-4 = %{T2}%{T-}
animation-charging-framerate = 750
animation-charging-foreground = ${colors.peach}

; иконки по уровню заряда при разрядке
ramp-capacity-0 = %{T3}%{T-}
ramp-capacity-1 = %{T3}%{T-}
ramp-capacity-2 = %{T3}%{T-}
ramp-capacity-3 = %{T3}%{T-}
ramp-capacity-4 = %{T3}%{T-}

[module/idle]
type = custom/script
exec = ~/.config/polybar/scripts/idle-toggle.sh --status
interval = 2

click-left = ~/.config/polybar/scripts/idle-toggle.sh --toggle &
click-right = ~/.config/polybar/scripts/idle-toggle.sh --toggle &

label-foreground = ${colors.primary}

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#F0C674}%ifname%%{F#707880} disconnected

#[module/wlan]
#inherit = network-base
#interface-type = wireless
#label-connected = %{F#F0C674}%ifname%%{F-} %essid%

#[module/eth]
#inherit = network-base
#interface-type = wired
#label-connected = %{F#F0C674}%ifname%%{F-} %local_ip%

[module/date]
type = internal/date
interval = 1

date = %d.%m.%y %H:%M
date-alt = %d.%m.%Y %H:%M:%S

label = %{A1:firefox calendar.google.com &:}%date%%{A}
label-foreground = ${colors.primary}

[settings]
screenchange-reload = true
pseudo-transparency = true

#vim:ft=dosini

[module/i3]
type = internal/i3

; показываем только режим
format = <label-mode>
label-mode = %mode%

; немного оформления, чтобы было видно
label-mode-padding = 2
label-mode-foreground = ${colors.text}
label-mode-background = ${colors.surface1}
