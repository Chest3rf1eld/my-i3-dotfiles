[terminal.shell]
program = "/bin/zsh"
args = ["-l"]

[window]
padding = { x = 14, y = 12 }
dynamic_padding = true
decorations = "None"
opacity = 1.0

[scrolling]
history = 10000

[font]
size = 10.5

# x must stay 0: any extra advance widens the cell without widening the glyph,
# which leaves a 1px unpainted seam at every powerline separator in the tmux bar.
[font.offset]
x = 0
y = 0

[font.normal]
family = "Cascadia Mono NF"
style = "Regular"

[font.bold]
family = "Cascadia Mono NF"
style = "Bold"

[font.italic]
family = "Cascadia Mono NF"
style = "Italic"

[font.bold_italic]
family = "Cascadia Mono NF"
style = "Bold Italic"

[cursor]
style = { shape = "Beam", blinking = "On" }
blink_interval = 550

[selection]
save_to_clipboard = true

[colors.primary]
background = "#181512"
foreground = "#e8ded0"
dim_foreground = "#938778"

[colors.cursor]
text = "#181512"
cursor = "#e39a50"

[colors.vi_mode_cursor]
text = "#181512"
cursor = "#dfbd6f"

[colors.selection]
text = "#f4ece2"
background = "#463c32"

[colors.normal]
black = "#211d19"
red = "#cf7163"
green = "#9eae76"
yellow = "#d5b568"
blue = "#7899aa"
magenta = "#b2879b"
cyan = "#7ea397"
white = "#c9bdaf"

[colors.bright]
black = "#6b5f51"
red = "#e88979"
green = "#b5c78b"
yellow = "#ebca7d"
blue = "#91b2c3"
magenta = "#caa0b4"
cyan = "#96bcaf"
white = "#f4ece2"

[colors.dim]
