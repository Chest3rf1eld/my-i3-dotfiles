backend = "glx";
vsync = true;

corner-radius = 10;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Polybar'"
];

shadow = true;
shadow-radius = 18;
shadow-opacity = 0.32;
shadow-offset-x = -8;
shadow-offset-y = -8;
shadow-color = "#100e0c";
shadow-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c"
];

fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 5;

active-opacity = 1.0;
# Полная непрозрачность неактивных окон убирает артефакты/полосы.
inactive-opacity = 1.0;
frame-opacity = 1.0;

opacity-rule = [
  "98:class_g = 'Rofi'",
  # Окно блокировки не бывает сфокусированным, поэтому под inactive-opacity
  # оно просвечивало и сквозь него читался текст в окнах под ним.
  "100:class_g = 'i3lock'"
];

detect-client-opacity = true;
detect-rounded-corners = true;
use-damage = true;
